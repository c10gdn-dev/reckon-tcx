name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor, current stable, and the one in between. Zero runtime
        # dependencies make the matrix nearly free, and it is what stops the
        # supported range in pyproject.toml from being an untested claim.
        python-version: ["3.12", "3.13", "3.14"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Test with 100% coverage gate
        run: uv run pytest

  terraform:
    # `deploy/terraform/` has no unit tests and coverage does not apply to it, so
    # the gate is the provider's own checking: formatting and a full validate,
    # which catches a missing argument or a mistyped reference. Neither needs AWS
    # credentials, so this runs on every pull request like the rest.
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16"
      - name: Check formatting
        run: terraform -chdir=deploy/terraform fmt -check -diff
      - name: Validate
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate

  diagrams:
    # Two failures, both silent otherwise: a .puml that no longer renders, and a
    # committed .svg that no longer matches the source it was generated from.
    #
    # What this does NOT catch is a diagram that renders perfectly and describes
    # something the code no longer does. That has happened once here, and no tool
    # finds it — only reading the diagram against the code does.
    name: diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a pinned plantuml
        # Pinned so a plantuml upgrade is a deliberate change rather than a
        # surprise. The comparison itself is on rendered text, not bytes, because
        # box geometry is font-derived and a runner's fonts are not this
        # machine's.
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          curl -fsSL -o "$RUNNER_TEMP/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
        env:
          PLANTUML_VERSION: "1.2026.7"
      - name: Validate sources and check the committed SVGs are current
        run: make check-diagrams PLANTUML="java -jar $RUNNER_TEMP/plantuml.jar"

  mutation:
    # Non-blocking. Mutation testing is a signal about the tests, not a gate on
    # the code, and a slow flaky gate gets ignored or disabled. It runs on the
    # transform only, where an undetected mutant would mean a wrong number
    # rather than a crash.
    name: mutation (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync
      - name: Mutate reckon.core
        run: uv run mutmut run --no-progress || true
      - name: Report surviving mutants
        if: always()
        run: uv run mutmut results || true
