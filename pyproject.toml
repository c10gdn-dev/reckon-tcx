[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI: `reckon` is taken, `reckon-tcx` is not (checked 2026-08-24). The import
# package and the CLI are both still `reckon`; only the distribution differs.
name = "reckon-tcx"
version = "0.1.0"
description = "Corrects Fitbit's GPS distance inflation before uploading to Strava."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "c10gdn" }]
keywords = ["fitbit", "strava", "tcx", "gps", "running", "dead-reckoning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]

# Zero runtime dependencies, deliberately — see PLAN.md §3. This is what lets
# Terraform's archive_file zip src/ directly with no build step. Do not add
# `requests`; it is not in the Lambda Python runtime.
dependencies = []

[project.scripts]
reckon = "reckon.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "coverage>=7.5",
  "ruff>=0.6",
  "moto>=5.0",
  "mutmut>=3.0",
  "boto3>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reckon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-branch --strict-markers -q"

[tool.coverage.run]
branch = true
source = ["src/reckon"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.$",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into private helpers to pin down branch behaviour.
"tests/*" = ["SLF001"]

[tool.mutmut]
paths_to_mutate = ["src/reckon/core/"]
tests_dir = ["tests/"]
